name: VIGLESS picks heartbeat
# Builds and locks the day's AI picks so the record fills in even with no visitors.
# GitHub only fires scheduled runs every 2-4 hours in practice, so each run stays up for
# about 5h50m and pings every 8 minutes. A new run replaces the old one, so there is no gap.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: heartbeat
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Keep picks building and locking
        run: |
          end=$(( $(date +%s) + 350*60 ))
          while [ $(date +%s) -lt $end ]; do
            curl -fsS -m 280 -o /dev/null -w "$(date -u +%H:%M) %{http_code}\n" https://vigless.pplx.app/port/5000/api/cron/picks || echo "$(date -u +%H:%M) ping failed"
            sleep 480
          done
      - name: Start the next run (no gap between runs)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run picks.yml -R ${{ github.repository }}
