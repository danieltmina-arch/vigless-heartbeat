name: VIGLESS picks heartbeat
# Builds and locks the day's AI picks on a schedule so the record fills in even with no visitors.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Build picks
        run: |
          for i in 1 2 3; do
            if curl -fsS -m 280 https://vigless.pplx.app/port/5000/api/cron/picks; then exit 0; fi
            sleep 20
          done
          exit 1
